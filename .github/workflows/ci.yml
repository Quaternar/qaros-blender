name: ci

# Tests on every push to main and every pull request. Releases are made by release.yml.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: VERSION equals bl_info["version"]
        run: python tools/package_release.py --check
      - name: Unit tests
        run: python tools/run_tests.py --group unit
      - name: Add-on ZIP
        run: python tools/build_zip.py
      - uses: actions/upload-artifact@v4
        with:
          name: qaros_anari
          path: dist/qaros_blender_anari.zip
